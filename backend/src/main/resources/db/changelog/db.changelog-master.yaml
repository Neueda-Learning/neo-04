# Liquibase master changelog — this service owns its schema and nothing else's.
# Add one file per change set under changes/ and include it here in order.
# Never edit an already-applied change set; add a new one.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-demo-showcase.yaml
  - include:
      file: db/changelog/changes/002-create-screening-case.yaml
  - include:
      file: db/changelog/changes/003-drop-demo-showcase.yaml
  - include:
      file: db/changelog/changes/004-seed-high-risk-countries-v1.sql
  - include:
      file: db/changelog/changes/005-seed-watchlist-entries-v1.sql
  - include:
      file: db/changelog/changes/006-alter-screening-config-current-version.yaml
  - include:
      file: db/changelog/changes/007-correct-watchlist-seed-names.sql
  - include:
      file: db/changelog/changes/008-fix-watchlist-dob-and-trailing-space.sql
  - include:
      file: db/changelog/changes/009-add-analyst-queue-fields.yaml
